<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 쉐도잉 연습 · 구동사 + be going to + 속담</title>
<style>
  :root{--bg:#0f1226;--card:#1a1f3d;--card2:#232a52;--accent:#7c8cff;--accent2:#4ad0c0;
    --text:#eef1ff;--muted:#9aa3d0;--good:#3ddc84;--bad:#ff6b7d;--shadow:0 10px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#26306a 0%,transparent 60%),var(--bg);
    color:var(--text);min-height:100vh;padding:18px;}
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin:8px 0 14px;position:relative;}
  .refresh{position:absolute;top:0;right:0;border:1px solid #2c3566;background:var(--card);color:var(--text);
    width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;transition:.15s;line-height:1}
  .refresh:hover{background:var(--card2)}
  .refresh:active{transform:rotate(180deg) scale(.92)}
  .refresh.sync{right:46px}
  .refresh.sync:active{transform:scale(.92)}
  .syncline{color:var(--muted);font-size:11px;margin-top:4px;min-height:14px}
  header h1{font-size:20px;letter-spacing:-.3px}
  header p{color:var(--muted);font-size:12px;margin-top:5px}
  .lessons{position:relative;margin-bottom:12px}
  .lessons label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px 4px;letter-spacing:.3px}
  .lessons select{width:100%;appearance:none;-webkit-appearance:none;
    border:1px solid #2c3566;background:linear-gradient(135deg,var(--accent),#5a6bd8);color:#fff;
    padding:13px 42px 13px 16px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;
    line-height:1.3;transition:.15s;box-shadow:var(--shadow)}
  .lessons select:focus{outline:none;border-color:var(--accent2)}
  .lessons select option{background:var(--card);color:var(--text);font-weight:600}
  .lessons .selwrap{position:relative}
  .lessons .selwrap::after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#fff;font-size:14px;pointer-events:none}
  .lessons .reroll{margin-top:8px;width:100%;border:1px solid #2c3566;background:var(--card2);color:var(--text);
    padding:10px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .lessons .reroll:hover{background:#242c55}
  .lessons .reroll:active{transform:scale(.98)}
  .tabs{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:14px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .tabs button.active{background:var(--accent);color:#fff}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .chip{background:var(--card);color:var(--text);border:1px solid #2c3566;border-radius:10px;
    padding:8px 12px;font-size:12px;cursor:pointer}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chipwrap{display:flex;flex-wrap:wrap;gap:6px}
  .card{background:linear-gradient(160deg,var(--card),var(--card2));border-radius:20px;padding:26px 22px;
    box-shadow:var(--shadow);margin-bottom:14px}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
  .pvtag{background:rgba(124,140,255,.18);color:#c3ccff;padding:4px 10px;border-radius:20px;font-weight:700}
  .en{font-size:clamp(28px,6vw,44px);line-height:1.4;font-weight:600;margin:6px 0 4px;word-break:keep-all}
  .en b{color:var(--accent2)}
  .ko{font-size:18px;color:var(--muted);line-height:1.5;margin-top:12px;min-height:22px;transition:.2s}
  .ko.hidden{filter:blur(7px);opacity:.5}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn.play{background:var(--accent2);color:#04201c}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid #333c6e}
  .btn.auto{background:var(--card2);color:var(--text);border:1px solid #333c6e}
  .btn.auto.active{background:linear-gradient(135deg,var(--accent),#5a6bd8);color:#fff;border-color:transparent}
  .btn:active{transform:scale(.96)}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  .nav .btn{flex:1}
  .speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  input[type=range]{accent-color:var(--accent2)}
  .progress{height:6px;background:var(--card);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
  .counter{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
  .qinput{width:100%;background:var(--card);border:1px solid #2c3566;border-radius:12px;color:var(--text);
    padding:14px;font-size:16px;margin-top:16px}
  .feedback{margin-top:14px;font-size:14px;line-height:1.6;min-height:20px}
  .feedback .ok{color:var(--good);font-weight:700}
  .feedback .no{color:var(--bad);font-weight:700}
  .diff .miss{background:rgba(255,107,125,.25);border-radius:4px;padding:0 2px}
  .choices{display:grid;gap:10px;margin-top:16px}
  .choice{text-align:left;background:var(--card);border:1px solid #2c3566;color:var(--text);
    padding:14px;border-radius:12px;cursor:pointer;font-size:15px;transition:.12s}
  .choice:hover{border-color:var(--accent)}
  .choice.correct{background:rgba(61,220,132,.18);border-color:var(--good)}
  .choice.wrong{background:rgba(255,107,125,.18);border-color:var(--bad)}
  .score{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
  .qmode{display:flex;gap:8px;margin-bottom:12px}
  .qmode button{flex:1}
  .hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
  footer{text-align:center;color:var(--muted);font-size:11px;margin:24px 0 8px;line-height:1.6}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),#5a6bd8);
    color:#fff;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);
    z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  /* CLI 모드: 터미널 스타일 따라 입력 */
  .term{background:#0b0e1f;border:1px solid #2c3566;border-radius:14px;padding:16px;height:56vh;overflow-y:auto;
    font-family:Consolas,"Courier New",monospace;font-size:15px;line-height:1.7;cursor:text}
  .term .help{color:var(--muted);font-size:12px}
  .term .sent{font-weight:700;font-size:17px;margin-top:12px;color:var(--text)}
  .term .sent .idx{color:var(--accent)}
  .term .u{color:#c3ccff}
  .term .ok{color:var(--good)}
  .term .mean{color:var(--accent2)}
  .term .no2{color:var(--bad)}
  .cliLine{display:flex;gap:8px;align-items:center;margin-top:10px;background:#0b0e1f;border:1px solid #2c3566;
    border-radius:12px;padding:12px 14px;font-family:Consolas,"Courier New",monospace;font-size:15px}
  .cliLine .cliPrompt{color:var(--accent2);font-weight:700}
  .cliLine input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font:inherit}
  /* 자동재생 집중 모드: 현재 문장만 크게 표시하고 나머지 UI는 숨김 */
  body.autoplay header,body.autoplay .lessons,body.autoplay .tabs,body.autoplay .controls,
  body.autoplay .progress,body.autoplay #typeInput,body.autoplay #typeFb,
  body.autoplay .nav,body.autoplay .counter,body.autoplay footer,
  body.autoplay .row .btn.play,body.autoplay .row .btn.ghost,body.autoplay .row .speed{display:none}
  body.autoplay{padding:18px}
  body.autoplay .wrap{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 36px)}
  body.autoplay .card{text-align:center;padding:56px 28px;margin-bottom:0}
  body.autoplay .meta{justify-content:center;gap:12px}
  body.autoplay .en{font-size:clamp(36px,7.5vw,58px)}
  body.autoplay .ko{font-size:clamp(19px,3.5vw,26px);margin-top:20px}
  body.autoplay .row{justify-content:center;margin-top:30px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <button class="refresh" onclick="location.reload()" title="새로고침">🔄</button>
    <button class="refresh sync" id="syncBtn" onclick="setupSync()" title="기기 간 학습 기록 동기화">☁️</button>
    <h1>🎬 영어 쉐도잉 연습</h1>
    <p>미드 스타일 필수 표현 · 레슨을 골라 연습하세요</p>
    <p class="syncline" id="syncStatus"></p>
  </header>

  <div class="lessons" id="lessons"></div>

  <div class="tabs">
    <button id="tabStudy" class="active" onclick="setTab('study')">📖 학습·쉐도잉</button>
    <button id="tabQuiz" onclick="setTab('quiz')">✍️ 퀴즈·받아쓰기</button>
    <button id="tabCli" onclick="setTab('cli')">⌨️ CLI 모드</button>
  </div>

  <div class="controls"><div class="chipwrap" id="filters"></div></div>

  <section id="study">
    <div class="progress"><div id="bar"></div></div>
    <div class="card">
      <div class="meta"><span class="pvtag" id="pvtag"></span><span id="idx"></span></div>
      <div class="en" id="en"></div>
      <div class="ko hidden" id="ko" onclick="revealKo()"></div>
      <div class="row">
        <button class="btn play" onclick="speakCurrent()">🔊 듣기</button>
        <button class="btn ghost" onclick="toggleKo()">🇰🇷 뜻 보기</button>
        <button class="btn auto" id="autoBtn" onclick="toggleAuto()">▶ 자동재생</button>
        <div class="speed">속도 <input type="range" min="0.5" max="1.2" step="0.1" value="0.9" id="rate" oninput="rateLbl()"><span id="rateLbl">0.9x</span></div>
      </div>
      <input class="qinput" id="typeInput" placeholder="⌨️ 문장을 따라 입력하세요 (Enter → 뜻 확인 후 다음 문장)" autocomplete="off" onkeydown="if(event.key==='Enter')typeEnter()">
      <div class="feedback" id="typeFb"></div>
      <div class="nav">
        <button class="btn ghost" onclick="prev()">◀ 이전</button>
        <button class="btn ghost" onclick="shuffle()">🔀 섞기</button>
        <button class="btn ghost" onclick="next()">다음 ▶</button>
      </div>
    </div>
    <div class="counter">문장을 클릭하면 뜻이 나와요 · ⌨️ <b>1</b> 듣기 · <b>2</b> 뜻 보기 · <b>3</b> 자동재생 · <b>Space</b> 다음</div>
  </section>

  <section id="quiz" style="display:none">
    <div class="qmode">
      <button class="btn ghost active" id="qmDict" onclick="setQmode('dict')">받아쓰기</button>
      <button class="btn ghost" id="qmChoice" onclick="setQmode('choice')">뜻 맞히기</button>
    </div>
    <div class="card">
      <div class="meta"><span class="pvtag" id="qpvtag">?</span><span id="qidx"></span></div>
      <div id="dictBox">
        <div class="ko" id="qko" style="font-size:17px;color:var(--text)"></div>
        <button class="btn play" style="margin-top:14px" onclick="speakQuiz()">🔊 듣고 받아쓰기</button>
        <input class="qinput" id="qinput" placeholder="들은 문장을 영어로 입력하세요" autocomplete="off" onkeydown="if(event.key==='Enter')checkDict()">
        <div class="row">
          <button class="btn play" onclick="checkDict()">확인</button>
          <button class="btn ghost" onclick="hintDict()">힌트</button>
          <button class="btn ghost" onclick="nextQuiz()">다음 ▶</button>
        </div>
        <div class="feedback" id="dictFb"></div>
        <div class="hint">⌨️ 단축키 — <b>3</b>: 듣기 · <b>1</b>: 확인 · <b>2</b>: 다음 문장 · <b>Enter</b>: 확인</div>
      </div>
      <div id="choiceBox" style="display:none">
        <div class="ko" id="qcko" style="font-size:17px;color:var(--text)"></div>
        <div style="font-size:13px;color:var(--muted);margin-top:6px" id="choicePrompt"></div>
        <div class="choices" id="choices"></div>
        <div class="row"><button class="btn ghost" onclick="nextQuiz()">다음 ▶</button></div>
        <div class="feedback" id="choiceFb"></div>
      </div>
    </div>
    <div class="score" id="score">점수: 0 / 0</div>
  </section>

  <section id="cli" style="display:none">
    <div class="card" style="padding:14px">
      <div class="term" id="term" onclick="document.getElementById('cliInput').focus()"></div>
      <div class="cliLine">
        <span class="cliPrompt">&gt;</span>
        <input id="cliInput" autocomplete="off" spellcheck="false" placeholder="문장을 따라 입력하고 Enter"
          onkeydown="if(event.key==='Enter')cliEnter()">
      </div>
    </div>
  </section>

  <footer>
    예문·속담은 각 주제를 학습하기 위해 정리한 것으로, 널리 알려진 표현과 새로 작성한 오리지널 문장입니다.<br>
    음성은 브라우저 내장 TTS(Web Speech API) · Chrome·Edge 권장.
  </footer>
</div>

<!-- 레슨 데이터 (레슨별 개별 파일) -->
<script src="lessons/01-phrasal.js"></script>
<script src="lessons/02-goingto.js"></script>
<script src="lessons/03-proverb.js"></script>
<script src="lessons/04-business.js"></script>
<script src="lessons/05-travel.js"></script>
<script src="lessons/06-supposed.js"></script>
<script src="lessons/07-self.js"></script>
<script src="lessons/08-polite.js"></script>
<script src="lessons/09-conditional.js"></script>
<script src="lessons/10-yt-coo5jphme6i.js"></script>
<script src="lessons/11-yt-pae6tjz2jxs.js"></script>
<script src="lessons/12-yt-q64f6p4f7k0.js"></script>
<script src="lessons/13-yt-odlsgnskuig.js"></script>
<script src="lessons/14-yt-v585or9fpuu.js"></script>
<script src="lessons/15-yt-rvhcbrpboiu.js"></script>
<script src="lessons/16-yt-f9i-xtwwl0q.js"></script>
<script src="lessons/17-yt-hchn8gqxqeq.js"></script>
<script src="lessons/18-yt-5yfjtpi4bhg.js"></script>
<script>
// 레슨 데이터는 lessons/*.js 에서 window.LESSONS 로 로드됨
const LESSONS = window.LESSONS || [];
let li=0, filter='all', list=[], cur=0, koShown=false;
let randomMode=false, randomLesson=null;   // 전체 랜덤 모드

const CONJ={talk:['talking','talked','talks','talk'],hang:['hanging','hung','hangs','hang'],
  turn:['turning','turned','turns','turn'],show:['showing','showed','shown','shows','show'],
  run:['running','ran','runs','run'],live:['living','lived','lives','live']};
function headRe(v){return new RegExp('\\b('+CONJ[v].join('|')+')\\b','i');}
function boldPhrasal(s,it){
  const tail=it.tag.split(' ').slice(1);
  let out=s.replace(headRe(it.v),'<b>$1</b>');
  tail.forEach(p=>{out=out.replace(new RegExp('(?<!<b>)\\b('+p+')\\b','i'),'<b>$1</b>');});
  return out;
}
function boldGoingto(s){
  let out=s.replace(/\b(gonna|going to)\b/i,'<b>$1</b>');
  out=out.replace(/([A-Za-z]+'ll)/,'<b>$1</b>');
  out=out.replace(/(?<!<b>)\b(won't|will)\b/i,'<b>$1</b>');
  return out;
}
function boldCond(s){var out=s.replace(/\b(as long as|as though|as if|provided that|provided|in case|even if|only if|if only|unless|if|wish)\b/i,'<b>$1</b>');out=out.replace(/(?<!<b>)\b(would have|could have|might have|would|could|might)\b/i,'<b>$1</b>');return out;}
// 현재 활성 레슨(전체 랜덤 모드면 합성 레슨) 반환
function curLesson(){return randomMode&&randomLesson?randomLesson:LESSONS[li];}
// 선택한 레슨(또는 랜덤 모드)을 저장해 새로고침 후에도 유지
const SAVE_KEY='shadowing.lesson';
function saveSel(){try{localStorage.setItem(SAVE_KEY,randomMode?'__random':(LESSONS[li]&&LESSONS[li].id||''));}catch(e){}touch();}
function restoreSel(){try{const s=localStorage.getItem(SAVE_KEY);
  if(s==='__random'){randomMode=true;buildRandom();}
  else if(s){const i=LESSONS.findIndex(L=>L&&L.id===s);if(i>=0)li=i;}
}catch(e){}}
// 모든 레슨에서 문장을 모아 섞은 뒤 100개를 뽑아 합성 레슨 구성
function buildRandom(){const pool=[];
  LESSONS.forEach(L=>{if(L&&L.id!=='__random'&&L.data)L.data.forEach(d=>pool.push(d));});
  for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  randomLesson={id:'__random',name:'🎲 전체 랜덤 100문장',gl:'',groups:[],bold:'',choiceBy:'en',
    choicePrompt:'위 뜻에 맞는 영어 문장을 고르세요',data:pool.slice(0,100)};}
function bold(s,it){const b=curLesson().bold;if(b==='phrasal')return boldPhrasal(s,it);if(b==='goingto')return boldGoingto(s);if(b==='supposed')return s.replace(/\b(supposed to)\b/i,'<b>$1</b>');if(b==='cond')return boldCond(s);return s;}
function data(){return curLesson().data;}
function ansOf(d){return curLesson().choiceBy==='en'?d.en:d.tag;}

function pickVoice(){const vs=speechSynthesis.getVoices();const en=vs.filter(v=>/^en/i.test(v.lang));
  // 자연스러운 최신(온라인·신경망) 음성 우선 → 그다음 고품질 로컬 음성 → 일반 영어 음성
  const rank=v=>{const n=(v.name+' '+v.lang).toLowerCase();let s=0;
    if(/natural|neural|online/.test(n))s+=100;
    if(/google/.test(n))s+=60;
    if(/aria|jenny|libby|sonia|emma|ava|samantha/.test(n))s+=40;
    if(/zira|david|mark|hazel/.test(n))s+=10;
    if(/en[-_]us/.test(n))s+=8;else if(/en[-_]gb/.test(n))s+=5;
    if(v.localService)s+=1;return s;};
  return en.slice().sort((a,b)=>rank(b)-rank(a))[0]||null;}
function speak(t,onend,rate){if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 재생을 지원하지 않아요');return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-US';
  u.rate=rate||parseFloat(document.getElementById('rate').value);
  u.pitch=1.0;u.volume=1.0;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);}

function buildLessons(){const box=document.getElementById('lessons');box.innerHTML='';
  const lbl=document.createElement('label');lbl.textContent='레슨 선택';lbl.htmlFor='lessonSelect';box.appendChild(lbl);
  const wrap=document.createElement('div');wrap.className='selwrap';
  const sel=document.createElement('select');sel.id='lessonSelect';
  const ro=document.createElement('option');ro.value='random';ro.textContent='🎲 전체 랜덤 100문장';if(randomMode)ro.selected=true;sel.appendChild(ro);
  LESSONS.forEach((L,i)=>{if(!L||L.id==='__random')return;const o=document.createElement('option');o.value=i;
    o.textContent=(isLessonDone(L)?'✅ ':'')+L.name;if(!randomMode&&i===li)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{if(sel.value==='random'){randomMode=true;buildRandom();}else{randomMode=false;li=+sel.value;}saveSel();filter='all';rebuild();};
  wrap.appendChild(sel);box.appendChild(wrap);
  if(randomMode){const rb=document.createElement('button');rb.className='reroll';rb.textContent='🎲 다른 100문장 다시 뽑기';
    rb.onclick=()=>{buildRandom();filter='all';applyFilter();};box.appendChild(rb);}}
function buildFilters(){const box=document.getElementById('filters');box.innerHTML='';
  const gs=['all',...curLesson().groups];
  gs.forEach(g=>{const b=document.createElement('button');b.className='chip'+(g===filter?' active':'');
    b.textContent=g==='all'?'전체':g;b.onclick=()=>{filter=g;applyFilter();};box.appendChild(b);});}
// 재생한 문장 기억: 전체 문장을 완료하기 전까지 다시 보여주지 않음 (레슨별 localStorage 저장)
let seen=new Set();
function seenKey(){return 'shadowing.seen.'+(curLesson().id||'');}
function loadSeen(){try{seen=new Set(JSON.parse(localStorage.getItem(seenKey())||'[]'));}catch(e){seen=new Set();}}
function saveSeen(){try{localStorage.setItem(seenKey(),JSON.stringify([...seen]));}catch(e){}touch();}
function resetSeen(){seen=new Set();saveSeen();}
function markSeen(d){if(d&&!seen.has(d.en)){seen.add(d.en);saveSeen();updateIdx();}}
function seenCnt(){return list.reduce((n,d)=>n+(seen.has(d.en)?1:0),0);}
// 남은(안 본) 문장이 없으면 -1 — 완료 처리는 onListDone()이 담당 (함부로 초기화하지 않음)
function firstUnseenIdx(){for(let i=0;i<list.length;i++)if(!seen.has(list[i].en))return i;return -1;}
function nextUnseenIdx(from){for(let k=1;k<=list.length;k++){const i=(from+k)%list.length;if(!seen.has(list[i].en))return i;}return -1;}
// 레슨 완료 판정: 해당 레슨의 모든 문장이 완료 기록에 있는가
function seenSetOf(id){try{return new Set(JSON.parse(localStorage.getItem('shadowing.seen.'+id)||'[]'));}catch(e){return new Set();}}
function isLessonDone(L){if(!L||!L.data||!L.data.length)return false;const s=seenSetOf(L.id);return L.data.every(d=>s.has(d.en));}
function nextIncompleteLi(){for(let k=1;k<=LESSONS.length;k++){const i=(li+k)%LESSONS.length;const L=LESSONS[i];
  if(L&&L.id!=='__random'&&!isLessonDone(L))return i;}return -1;}
function clearAllSeen(){const ks=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('shadowing.seen.')===0)ks.push(k);}
  ks.forEach(k=>localStorage.removeItem(k));}catch(e){}
  // 세대 번호 증가: 의도된 전체 초기화만 동기화 병합(합집합)을 이기고 전파됨
  try{localStorage.setItem('shadowing.sync.gen',String(+(localStorage.getItem('shadowing.sync.gen')||0)+1));}catch(e){}
  seen=new Set();touch();}
let toastT=null;
function toast(m){const el=document.getElementById('toast');if(!el)return;
  el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
// 현재 목록의 문장을 모두 완료했을 때: 그룹→레슨 나머지, 레슨→다음 미완료 레슨,
// 전체 레슨 완료 시에만 기록을 초기화하고 처음부터 다시 시작
function onListDone(){
  if(randomMode){
    const all=[];LESSONS.forEach(L=>{if(L&&L.id!=='__random'&&L.data)L.data.forEach(d=>all.push(d.en));});
    const s=seenSetOf('__random');
    if(all.every(en=>s.has(en))){try{localStorage.removeItem('shadowing.seen.__random');}catch(e){}}
    buildRandom();applyFilter();toast('🎲 100문장 완료! 새로운 100문장을 뽑았어요');return;}
  if(filter!=='all'){filter='all';applyFilter();toast('그룹 완료! 레슨의 남은 문장으로 이어가요');return;}
  const n=nextIncompleteLi();
  if(n>=0){const doneName=LESSONS[li].name;li=n;saveSel();filter='all';rebuild();
    toast('🎉 '+doneName+' 완료! 다음 레슨으로 이동해요');}
  else{clearAllSeen();filter='all';rebuild();
    toast('🏆 모든 레슨 완료! 기록을 초기화하고 처음부터 다시 시작해요');}}
function applyFilter(){list=filter==='all'?data().slice():data().filter(d=>d.g===filter);loadSeen();
  const f=firstUnseenIdx();
  if(f<0&&list.length){onListDone();return;}
  cur=f<0?0:f;buildFilters();render();newQuiz();
  if(document.getElementById('cli').style.display!=='none')cliStart();else cliStarted=false;   // 레슨·필터 변경 시 CLI 세션 리셋
  if(autoPlay)restartAuto();}
function rebuild(){buildLessons();applyFilter();}

function updateIdx(){document.getElementById('idx').textContent=(cur+1)+' / '+list.length+' · 완료 '+seenCnt();}
function render(){const d=list[cur];if(!d)return;
  document.getElementById('pvtag').textContent=d.tag;
  updateIdx();
  document.getElementById('en').innerHTML=bold(d.en,d);
  document.getElementById('ko').textContent=d.ko;
  document.getElementById('bar').style.width=((cur+1)/list.length*100)+'%';
  document.getElementById('typeInput').value='';document.getElementById('typeFb').innerHTML='';}
// 학습 화면 타이핑 연습: 채점 없이 Enter로 뜻을 확인하고 잠시 후 다음 문장으로
let typeT=null;
function typeEnter(){const d=list[cur];if(!d||typeT)return;
  if(!document.getElementById('typeInput').value.trim())return;
  revealKo();markSeen(d);
  typeT=setTimeout(()=>{typeT=null;next();},1200);}
function toggleKo(){koShown=!koShown;document.getElementById('ko').classList.toggle('hidden',!koShown);}
function revealKo(){koShown=true;document.getElementById('ko').classList.remove('hidden');}
function next(){const i=nextUnseenIdx(cur);if(i<0){onListDone();return;}
  cur=i;koShown=false;document.getElementById('ko').classList.add('hidden');render();if(autoPlay)restartAuto();else speakCurrent();}
function prev(){cur=(cur-1+list.length)%list.length;koShown=false;document.getElementById('ko').classList.add('hidden');render();if(autoPlay)restartAuto();}
function shuffle(){for(let i=list.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]];}
  const f=firstUnseenIdx();if(f<0){onListDone();return;}cur=f;render();if(autoPlay)restartAuto();}
function speakCurrent(){markSeen(list[cur]);speak(list[cur].en);}

// 자동 재생: 현재 문장을 REPEAT번 읽고 다음 문장으로 자동 이동
const REPEAT=2,GAP=2000;let autoPlay=false,autoToken=0;
function toggleAuto(){setAuto(!autoPlay);}
function setAuto(on){autoPlay=on;autoToken++;speechSynthesis.cancel();
  const b=document.getElementById('autoBtn');b.classList.toggle('active',on);
  b.textContent=on?'⏸ 자동재생 중':'▶ 자동재생';
  document.body.classList.toggle('autoplay',on);   // 집중 모드: 현재 문장만 표시
  if(on){koShown=false;document.getElementById('ko').classList.add('hidden');autoRun(autoToken);}}
function restartAuto(){autoToken++;speechSynthesis.cancel();autoRun(autoToken);}
function autoRun(token){if(!autoPlay||token!==autoToken||!list.length)return;
  render();
  speakTimes(list[cur].en,REPEAT,token,()=>{
    if(!autoPlay||token!==autoToken)return;
    markSeen(list[cur]);   // 반복 재생을 마친 문장은 '이미 본 문장'으로 기억
    const i=nextUnseenIdx(cur);
    if(i<0){onListDone();return;}   // 레슨 완료 → 다음 레슨으로 (applyFilter의 restartAuto가 이어감)
    cur=i;koShown=false;document.getElementById('ko').classList.add('hidden');
    setTimeout(()=>autoRun(token),GAP);});}
function speakTimes(text,times,token,done){if(!autoPlay||token!==autoToken)return;
  if(times===REPEAT-1)revealKo();   // 2번째 반복 재생부터 한글 뜻을 보여줌
  speak(text,()=>{if(!autoPlay||token!==autoToken)return;
    if(times>1)setTimeout(()=>speakTimes(text,times-1,token,done),GAP);
    else done();},1.0);}   // 자동재생은 항상 1배속
function rateLbl(){document.getElementById('rateLbl').textContent=document.getElementById('rate').value+'x';}

let qmode='dict',q=null,right=0,total=0,answered=false;
function setQmode(m){qmode=m;
  document.getElementById('qmDict').classList.toggle('active',m==='dict');
  document.getElementById('qmChoice').classList.toggle('active',m==='choice');
  document.getElementById('dictBox').style.display=m==='dict'?'block':'none';
  document.getElementById('choiceBox').style.display=m==='choice'?'block':'none';
  newQuiz();}
function newQuiz(){answered=false;if(!list.length)return;
  q=list[Math.random()*list.length|0];
  document.getElementById('qpvtag').textContent=qmode==='choice'?'?':q.tag;
  document.getElementById('qko').textContent=q.ko;
  document.getElementById('qinput').value='';
  document.getElementById('dictFb').innerHTML='';
  document.getElementById('qcko').textContent=q.ko;
  const cb=curLesson().choiceBy;
  document.getElementById('choicePrompt').textContent=curLesson().choicePrompt||(cb==='en'?'위 뜻에 맞는 속담(영어)을 고르세요':(curLesson().bold==='phrasal'?'위 뜻에 알맞은 구동사를 고르세요':'위 문장에 어울리는 유형/뉘앙스를 고르세요'));
  buildChoices();
  document.getElementById('choiceFb').innerHTML='';}
function speakQuiz(){speak(q.en);}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function checkDict(){if(answered){nextQuiz();return;}
  const ans=norm(document.getElementById('qinput').value),target=norm(q.en);
  const fb=document.getElementById('dictFb');total++;answered=true;
  if(ans===target){right++;fb.innerHTML='<span class="ok">✅ 정확해요!</span>';}
  else{const tw=target.split(' '),aw=ans.split(' ');
    const h=tw.map((w,i)=>aw[i]===w?w:'<span class="miss">'+w+'</span>').join(' ');
    fb.innerHTML='<span class="no">❌ 다시 확인</span><br>정답: <span class="diff">'+h+'</span><br><span style="color:var(--muted)">'+q.en+'</span>';}
  updateScore();}
function hintDict(){const w=q.en.split(' ');
  document.getElementById('dictFb').innerHTML='<span style="color:var(--muted)">힌트: '+w.map(x=>x[0]+'___').join(' ')+' ('+w.length+'단어)</span>';}
function buildChoices(){const box=document.getElementById('choices');box.innerHTML='';
  const correct=ansOf(q);
  const pool=[...new Set(data().map(ansOf).filter(p=>p!==correct))];
  for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  let opts=[correct,...pool.slice(0,3)];
  for(let i=opts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[opts[i],opts[j]]=[opts[j],opts[i]];}
  opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;
    b.onclick=()=>pickChoice(b,o,correct);box.appendChild(b);});}
function pickChoice(btn,chosen,correct){if(answered)return;answered=true;total++;
  document.querySelectorAll('#choices .choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
  const detail=bold(q.en,q)+'<br><span style="color:var(--muted)">'+q.ko+'</span>';
  if(chosen===correct){right++;document.getElementById('choiceFb').innerHTML='<span class="ok">✅ 정답!</span><br>'+detail;}
  else{btn.classList.add('wrong');document.getElementById('choiceFb').innerHTML='<span class="no">❌ 오답</span><br>'+detail;}
  speak(q.en);updateScore();}
function nextQuiz(){newQuiz();}
function updateScore(){document.getElementById('score').textContent='점수: '+right+' / '+total+' ('+(total?Math.round(right/total*100):0)+'%)';}

function setTab(t){if(t!=='study'&&autoPlay)setAuto(false);
  ['study','quiz','cli'].forEach(s=>document.getElementById(s).style.display=s===t?'block':'none');
  document.getElementById('tabStudy').classList.toggle('active',t==='study');
  document.getElementById('tabQuiz').classList.toggle('active',t==='quiz');
  document.getElementById('tabCli').classList.toggle('active',t==='cli');
  speechSynthesis.cancel();
  if(t==='cli'){if(!cliStarted)cliStart();else document.getElementById('cliInput').focus();}}

// ── CLI 모드: 원 문장이 출력되면 그 아래 프롬프트에 따라 입력, 기록은 위로 스크롤 ──
let cliIdx=0,cliStarted=false;
function termEl(){return document.getElementById('term');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cliPrint(html,cls){const el=document.createElement('div');if(cls)el.className=cls;
  el.innerHTML=html;const t=termEl();t.appendChild(el);t.scrollTop=t.scrollHeight;}
function cliStart(){cliStarted=true;const f=firstUnseenIdx();
  if(f<0&&list.length){onListDone();return;}
  termEl().innerHTML='';cliIdx=f<0?0:f;
  cliPrint('영어 쉐도잉 CLI · 원 문장을 그대로 따라 입력하세요','help');
  cliPrint('Enter: 뜻 보고 다음 문장 · 빈 칸에서 Enter: 듣기','help');
  cliShow(false);}   // 시작할 때는 자동 재생하지 않음
function cliShow(speakIt){const d=list[cliIdx];if(!d)return;
  cliPrint('<span class="idx">['+(cliIdx+1)+'/'+list.length+']</span> '+esc(d.en),'sent');
  if(speakIt)speak(d.en);
  document.getElementById('cliInput').focus();}
function cliEnter(){const inp=document.getElementById('cliInput'),d=list[cliIdx];if(!d)return;
  const raw=inp.value;
  if(!raw.trim()){speak(d.en);return;}   // 빈 입력 → 현재 문장 다시 듣기
  cliPrint('&gt; '+esc(raw),'u');inp.value='';
  cliPrint('💬 '+esc(d.ko),'mean');markSeen(d);   // 정답 확인 없이 바로 뜻 공개
  const i=nextUnseenIdx(cliIdx);
  if(i<0){cliPrint('🎉 레슨 완료!','ok');setTimeout(onListDone,700);return;}
  cliIdx=i;setTimeout(()=>cliShow(true),400);}

// keyboard shortcuts — 퀴즈(받아쓰기): 3=듣기, 1=확인, 2=다음 · 학습: 1=듣기, 2=뜻 보기, 3=자동재생, Space=다음
document.addEventListener('keydown',function(e){
  const quizVisible=document.getElementById('quiz').style.display!=='none';
  if(quizVisible){
    if(qmode!=='dict')return;
    if(e.key==='3'){e.preventDefault();speakQuiz();}
    else if(e.key==='1'){e.preventDefault();checkDict();}
    else if(e.key==='2'){e.preventDefault();nextQuiz();}
    return;
  }
  if(document.getElementById('study').style.display==='none')return; // 학습 탭에서만 동작
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return; // 타이핑 중엔 무시
  if(e.key==='1'){e.preventDefault();speakCurrent();}
  else if(e.key==='2'){e.preventDefault();toggleKo();}
  else if(e.key==='3'){e.preventDefault();toggleAuto();}
  else if(e.key===' '){e.preventDefault();next();}
});

// ── GitHub Gist 동기화: 어디서 접속해도 학습 기록을 이어감 ──
// 기록(완료 문장·선택 레슨)을 비공개 Gist에 저장. 기기마다 토큰을 한 번만 입력하면 됨.
const SYNC_FILE='shadowing-progress.json',SYNC_DESC='영어 쉐도잉 학습 기록 (자동 동기화)';
const TK='shadowing.sync.token',GID='shadowing.sync.gist',LTS='shadowing.sync.ts',GEN='shadowing.sync.gen';
let syncTimer=null;
function tk(){try{return localStorage.getItem(TK)||'';}catch(e){return'';}}
function syncStatus(m){const el=document.getElementById('syncStatus');if(el)el.textContent=m;}
function touch(){try{localStorage.setItem(LTS,String(Date.now()));}catch(e){}
  if(tk()){clearTimeout(syncTimer);syncTimer=setTimeout(pushState,3000);}}
function collectState(){const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf('shadowing.')===0&&k.indexOf('shadowing.sync.')!==0)data[k]=localStorage.getItem(k);}
  return {updatedAt:+(localStorage.getItem(LTS)||0),gen:+(localStorage.getItem(GEN)||0),data};}
function applyState(s){Object.keys(s.data||{}).forEach(k=>{try{localStorage.setItem(k,s.data[k]);}catch(e){}});
  try{localStorage.setItem(LTS,String(s.updatedAt||0));localStorage.setItem(GEN,String(s.gen||0));}catch(e){}}
// 합집합 병합: 완료 기록(seen)은 로컬∪원격 — 어느 기기에서도 기록이 줄지 않음.
// seen 외 키(선택 레슨 등)는 타임스탬프가 최신인 쪽을 사용. 병합으로 로컬이 바뀌면 true.
function mergeStates(remote){const rts=remote.updatedAt||0,lts=+(localStorage.getItem(LTS)||0);
  const rd=remote.data||{};let changed=false;
  Object.keys(rd).forEach(k=>{
    if(k.indexOf('shadowing.seen.')===0){
      let loc=[],rem=[];
      try{loc=JSON.parse(localStorage.getItem(k)||'[]');}catch(e){}
      try{rem=JSON.parse(rd[k]||'[]');}catch(e){}
      const u=[...new Set(loc.concat(rem))];
      if(u.length!==loc.length){try{localStorage.setItem(k,JSON.stringify(u));}catch(e){}changed=true;}
    }else if(rts>lts&&localStorage.getItem(k)!==rd[k]){
      try{localStorage.setItem(k,rd[k]);}catch(e){}changed=true;}
  });
  if(rts>lts)try{localStorage.setItem(LTS,String(rts));}catch(e){}
  return changed;}
function gh(path,method,body){return fetch('https://api.github.com'+path,{method:method||'GET',
  headers:Object.assign({'Authorization':'token '+tk(),'Accept':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),
  body:body?JSON.stringify(body):undefined}).then(r=>{
    if(r.status===401){try{localStorage.removeItem(TK);}catch(e){}syncStatus('☁️ 토큰이 유효하지 않아요 — ☁️ 버튼으로 다시 설정');throw new Error('401');}
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
async function findGist(){let id=null;try{id=localStorage.getItem(GID);}catch(e){}
  if(id){try{return await gh('/gists/'+id);}catch(e){if(e.message==='401')throw e;try{localStorage.removeItem(GID);}catch(_){}}}
  const ls=await gh('/gists');const g=ls.find(x=>x.files&&x.files[SYNC_FILE]);
  if(g){try{localStorage.setItem(GID,g.id);}catch(e){}return gh('/gists/'+g.id);}
  return null;}
async function pushState(){if(!tk())return;syncStatus('☁️ 저장 중…');
  const body={description:SYNC_DESC,files:{}};body.files[SYNC_FILE]={content:JSON.stringify(collectState())};
  try{const id=localStorage.getItem(GID);
    if(id)await gh('/gists/'+id,'PATCH',body);
    else{body.public=false;const g=await gh('/gists','POST',body);localStorage.setItem(GID,g.id);}
    syncStatus('☁️ 동기화됨 · '+new Date().toLocaleTimeString());
  }catch(e){if(e.message!=='401')syncStatus('☁️ 저장 실패 — 네트워크를 확인하세요');}}
async function pullState(){if(!tk())return;syncStatus('☁️ 불러오는 중…');
  try{const g=await findGist();
    if(g&&g.files&&g.files[SYNC_FILE]){
      let c=g.files[SYNC_FILE].content;
      if(g.files[SYNC_FILE].truncated)c=await fetch(g.files[SYNC_FILE].raw_url).then(r=>r.text());
      const remote=JSON.parse(c||'{}');
      const lg=+(localStorage.getItem(GEN)||0),rg=+(remote.gen||0);
      let changed=false;
      if(rg>lg){applyState(remote);changed=true;}        // 원격에서 의도된 전체 초기화 → 그대로 반영
      else if(rg===lg)changed=mergeStates(remote);        // 같은 세대 → 합집합 병합 (기록이 줄지 않음)
      // rg<lg: 이 기기에서 전체 초기화됨 → 병합 없이 로컬 기준으로 올림
      if(changed){restoreSel();filter='all';rebuild();
        syncStatus('☁️ 학습 기록을 병합했어요 · '+new Date().toLocaleTimeString());}
      await pushState();   // 병합 결과를 서버에도 반영
    }else await pushState();   // 저장된 기록이 없으면 새로 만듦
  }catch(e){if(e.message!=='401')syncStatus('☁️ 불러오기 실패 — 네트워크를 확인하세요');}}
function setupSync(){
  if(tk()){pullState();return;}   // 이미 연결됨 → 버튼은 '지금 동기화'
  const t=prompt('기기 간 동기화를 위해 GitHub 개인 액세스 토큰(PAT)을 입력하세요.\n\n만드는 법: github.com/settings/tokens → Generate new token (classic) → "gist" 권한만 체크 → 생성된 토큰 복사\n\n토큰은 이 기기(브라우저)에만 저장됩니다.');
  if(!t||!t.trim())return;
  try{localStorage.setItem(TK,t.trim());}catch(e){}
  pullState();}
document.addEventListener('visibilitychange',()=>{   // 화면을 떠날 때 저장 대기 중이면 즉시 저장
  if(document.visibilityState==='hidden'&&tk()&&syncTimer){clearTimeout(syncTimer);syncTimer=null;pushState();}});

restoreSel();buildLessons();applyFilter();rateLbl();
if(tk())pullState();else syncStatus('☁️ 버튼을 누르면 다른 기기와 학습 기록이 동기화돼요');
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices();}
